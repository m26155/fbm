name: Build APK (Manual)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Build ${{ inputs.build_type }} APK
        run: ./gradlew assemble${{ inputs.build_type == 'debug' && 'Debug' || 'Release' }}
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.build_type }}-apk
          path: app/build/outputs/apk/${{ inputs.build_type }}/
          retention-days: 30
      
      - name: Create Release (if Release build)
        if: inputs.build_type == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/**/*.apk
          tag_name: v${{ github.run_number }}
          draft: false
          prerelease: false
