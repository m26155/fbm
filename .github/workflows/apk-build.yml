# Manual build APK workflow
# - Run manually from Actions → Manual build APK → Run workflow
# - Inputs: buildType (Debug/Release), apiLevel, buildTools, signing true/false
on:
  workflow_dispatch:
    inputs:
      buildType:
        description: 'Build variant name: Debug or Release'
        required: true
        default: 'Debug'
      apiLevel:
        description: 'Android API level (platforms;android-<apiLevel>)'
        required: true
        default: '33'
      buildTools:
        description: 'Build-tools version'
        required: true
        default: '33.0.2'
      signing:
        description: 'Enable release signing (requires secrets). true/false'
        required: true
        default: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set ANDROID_SDK_ROOT
        # Use the runner-provided environment variable RUNNER_TEMP — the runner context
        # is not available in job-level expressions, so we export the path into GITHUB_ENV here.
        run: echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> $GITHUB_ENV

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}

 - name: Set ANDROID_SDK_ROOT and persist PATH
        run: |
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=$RUNNER_TEMP/android-sdk" >> $GITHUB_ENV
          # Add expected SDK tool locations to PATH so subsequent steps can find sdkmanager/adb
          echo "PATH=$RUNNER_TEMP/android-sdk/cmdline-tools/latest/bin:$RUNNER_TEMP/android-sdk/platform-tools:$PATH" >> $GITHUB_ENV

      - name: Install Android commandline-tools & SDK components
        run: |
          set -e
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline.zip
          unzip -q cmdline.zip -d cmdline-tools-temp
          mkdir -p cmdline-tools/latest
          mv cmdline-tools-temp/cmdline-tools/* cmdline-tools/latest/
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-${{ github.event.inputs.apiLevel }}" "build-tools;${{ github.event.inputs.buildTools }}"

      - name: Build APK
        run: |
          set -e
          ./gradlew assemble${{ github.event.inputs.buildType }} --no-daemon -Pandroid.sdkRoot="$ANDROID_SDK_ROOT" --stacktrace --info
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-artifacts
          path: |
            app/build/outputs/**/*.apk
            **/build/outputs/**/*.apk
